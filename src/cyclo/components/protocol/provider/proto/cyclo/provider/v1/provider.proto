syntax = "proto3";

package cyclo.provider.v1;

import "google/protobuf/any.proto";

// Provider has a typed control plane and an opaque inference data plane.
//
// ListModels is understood by Cyclo because it is used to construct routes.
// Infer carries Pi's JSON representation without interpreting its contents.
// Provider relays forward payload strings unchanged; only a provider endpoint
// that actually invokes Pi may decode them.
service Provider {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc Infer(InferRequest) returns (stream InferResponse);
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

// A model ID is opaque, provider-local, and unique within one catalogue.
// Callers send it back unchanged in InferRequest.model.
message Model {
  string id = 1;
  string display_name = 2;
  ModelCapabilities capabilities = 3;
  optional uint64 context_window_tokens = 4;
  optional uint64 max_output_tokens = 5;
  repeated google.protobuf.Any extensions = 6;

  // Identifies the payload ABI accepted by Infer. Components must not connect
  // models whose inference_format they do not implement.
  string inference_format = 7;
}

message ModelCapabilities {
  repeated Modality input_modalities = 1;
  repeated Modality output_modalities = 2;
  bool function_tools = 3;
  bool parallel_tool_calls = 4;
  bool reasoning_summaries = 5;
  bool temperature = 6;
  bool top_p = 7;
  bool stop_sequences = 8;
  repeated string extension_types = 9;
  bool reasoning = 10;
}

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_TEXT = 1;
  MODALITY_IMAGE = 2;
  MODALITY_AUDIO = 3;
  MODALITY_DOCUMENT = 4;
}

// payload is a JSON string containing the Pi call frame. Cyclo routes on model
// and otherwise treats payload as an opaque sequence of Unicode characters.
message InferRequest {
  string model = 1;
  string payload = 2;
}

// Each response contains the JSON string for exactly one native Pi
// AssistantMessageEvent. Stream order and termination are Pi semantics, not
// additional Cyclo semantics.
message InferResponse {
  string payload = 1;
}
