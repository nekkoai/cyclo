[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclo-agent"
version = "0.2.4"
description = "Run Git-defined agent teams through an isolated credential proxy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Guida" }]
keywords = ["agents", "docker", "llm", "multi-agent", "orchestration"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "setuptools==83.0.0",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
  "wheel==0.47.0",
]

[project.scripts]
cyclo = "cyclo.cli:main"

[project.urls]
Homepage = "https://github.com/glguida/cyclo"
Repository = "https://github.com/glguida/cyclo"
Issues = "https://github.com/glguida/cyclo/issues"
Security = "https://github.com/glguida/cyclo/security/policy"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cyclo", "cyclo.*"]
namespaces = false

[tool.setuptools.package-data]
"cyclo.team.templates" = [
  "README.md",
  "*/*",
  "*/roles/*",
]
"cyclo.dashboard_static" = ["*.html", "*.css", "*.js"]
"cyclo.components" = [
  "README.md",
  "protocol/component/*",
  "protocol/component/gen/**/*",
  "protocol/component/proto/**/*",
  "protocol/component/src/*",
  "protocol/component/test/*",
  "protocol/component/test/fixtures/*",
  "protocol/provider/*",
  "protocol/provider/gen/**/*",
  "protocol/provider/proto/**/*",
  "protocol/provider/src/*",
  "protocol/provider/test/*",
  "protocol/provider/test/fixtures/*",
  "gateway/*",
  "gateway/src/*",
  "gateway/test/*",
  "passthrough/*",
  "passthrough/src/*",
  "passthrough/test/*",
  "pooler/*",
  "pooler/src/*",
  "pooler/test/*",
  "openai/*",
  "openai/src/*",
  "openai/test/*",
]
"cyclo.components.team" = [
  "README.md",
  "Dockerfile",
  "Dockerfile.dockerignore",
  "entrypoint.sh",
  "package.json",
  "package-lock.json",
  "agentws/*",
  "agentws/bin/*",
  "agentws/roles/*",
  "agentws/tools/*",
  "agentws/tools/agentws-public/*",
  "pi/*",
  "pi/src/*",
  "pi/test/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
"cyclo.components" = ["**/node_modules/**"]
"cyclo.components.team" = ["**/node_modules/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
