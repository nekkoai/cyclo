[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclo-agent"
version = "0.2.0"
description = "Run Git-defined agent teams through an isolated credential proxy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Guida" }]
keywords = ["agents", "docker", "llm", "multi-agent", "orchestration"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "setuptools==83.0.0",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
  "wheel==0.47.0",
]

[project.scripts]
cyclo = "cyclo.cli:main"

[project.urls]
Homepage = "https://github.com/glguida/cyclo"
Repository = "https://github.com/glguida/cyclo"
Issues = "https://github.com/glguida/cyclo/issues"
Security = "https://github.com/glguida/cyclo/security/policy"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyclo = [
  "team_templates/*",
  "team_templates/*/*",
  "team_templates/*/roles/*",
  "provider_runtime_context/*",
  "provider_runtime_context/.dockerignore",
  "team_runtime_context/*",
  "team_runtime_context/.dockerignore",
]
"cyclo._agentws" = [
  "template/*",
  "template/bin/*",
  "template/roles/*",
  "template/tools/*",
  "template/tools/agentws-public/*",
]
"cyclo.credential_gateway" = [
  "gateway_context/*",
  "gateway_context/.dockerignore",
]
"cyclo.dashboard_static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
