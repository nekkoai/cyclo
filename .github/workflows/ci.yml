name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --editable ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q

  node-and-shell:
    name: Node and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install shipped component dependencies
        run: |
          for package in components/protocol/component components/protocol/provider components/gateway components/passthrough adapters/pi; do
            npm ci --ignore-scripts --prefix "src/cyclo/$package"
          done
          npm ci --force --ignore-scripts --prefix src/cyclo/components/team-runtime
      - name: Run Node tests
        run: |
          node --test tests/*.mjs
          for package in components/protocol/component components/protocol/provider components/gateway components/passthrough adapters/pi; do
            npm test --prefix "src/cyclo/$package"
          done
      - name: Confirm generated protocol sources are current
        run: |
          generated_paths="
          src/cyclo/components/protocol/component/gen
          src/cyclo/components/protocol/provider/gen
          "
          git diff --exit-code -- $generated_paths
          generated_untracked=$(git ls-files --others --exclude-standard -- $generated_paths)
          if [ -n "$generated_untracked" ]; then
            printf '%s\n' \
              "untracked generated protocol files:" \
              "$generated_untracked" >&2
            exit 1
          fi
      - name: Audit shipped component dependencies
        run: python3 tools/dependency-audit
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            sh -n "$script"
          done < <(git grep -l '^#!/bin/sh$')

  package:
    name: Package and clean-wheel audit
    needs: node-and-shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install --require-hashes --requirement requirements/release.txt
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python tools/normalize-distributions dist
          python -m twine check dist/*
      - name: Exercise the built wheel installation
        env:
          # DComp is released separately and is not downloaded by Cyclo CI.
          # The local release builder runs the required API-1 integration.
          CYCLO_RELEASE_REQUIRE_DCOMP: "0"
        run: tools/release-acceptance "$PWD"/dist/cyclo_agent-*.whl
      - name: Confirm acceptance did not modify tracked files
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclo-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Credential-free Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Build team image
        run: |
          docker build --pull \
            --build-arg "CYCLO_HOST_UID=$(id -u)" \
            --build-arg "CYCLO_HOST_GID=$(id -g)" \
            --tag cyclo-team:ci \
            --file src/cyclo/components/team-runtime/Dockerfile \
            src/cyclo
      - name: Build a derived team image through Cyclo
        run: |
          PYTHONPATH=src python -c 'from pathlib import Path; from cyclo.images import Images; images = Images(); base = images.inspect("cyclo-team:ci"); assert base is not None; root = Path("tests/fixtures/derived-team").resolve(); images.build("cyclo-derived-team:ci", dockerfile=root / "Dockerfile", context=root, build_args=(("CYCLO_TEAM_BASE", base.reference),), labels=(("io.cyclo.team-base", base.id),))'
          docker run --rm --network none --entrypoint /bin/sh \
            cyclo-derived-team:ci -ceu \
            'test "$(cat /opt/cyclo-derived-team-smoke)" = cyclo-derived-team-ok'
      - name: Exercise the baked AgentWS team runtime
        run: PYTHONPATH=src tools/runtime-write-acceptance cyclo-team:ci
      - name: Build gateway image
        run: |
          docker build --pull \
            --tag cyclo-gateway:ci \
            --file src/cyclo/components/gateway/Dockerfile \
            src/cyclo/components
      - name: Build passthrough provider image
        run: |
          docker build --pull \
            --tag cyclo-passthrough:ci \
            --file src/cyclo/components/passthrough/Dockerfile \
            src/cyclo/components
      - name: Smoke-test images without credentials
        run: |
          docker run --rm --network none \
            cyclo-team:ci sh -ceu '
              python3 --version
              node --version
              npm --version
              pi --version
              command -v pi
              command -v pi-lens-analyze
              command -v pi-lens-mcp
              test "$(npm root -g)" = /opt/cyclo-agent-tools/lib/node_modules
              npm ls --prefix /opt/cyclo-agent-tools/lib --depth=0
              mkdir -p "$HOME/.pi/agent"
              printf "%s\n" \
                "{\"packages\":[\"npm:pi-web-access\",\"npm:pi-lens\",\"npm:pi-simplify\"]}" \
                > "$HOME/.pi/agent/settings.json"
              PI_OFFLINE=1 pi list > /tmp/pi-packages
              grep -F "npm:pi-web-access" /tmp/pi-packages
              grep -F "npm:pi-lens" /tmp/pi-packages
              grep -F "npm:pi-simplify" /tmp/pi-packages
              pi --offline --help > /tmp/pi-help
              grep -F "Extension CLI Flags" /tmp/pi-help
            '
          docker run --rm --network none \
            cyclo-gateway:ci providers > /tmp/cyclo-providers
          grep -F "Supported gateway providers" /tmp/cyclo-providers
          grep -F "LOGIN COMMAND" /tmp/cyclo-providers
          grep -F "cyclo gateway login anthropic" /tmp/cyclo-providers
          grep -F "cyclo gateway login openai --api-key-stdin" /tmp/cyclo-providers
          docker run --rm --network none cyclo-gateway:ci providers
          if printf 'q\n' | docker run --rm --interactive \
            --security-opt no-new-privileges --cap-drop ALL --pids-limit 256 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --network none cyclo-gateway:ci login openai-codex \
            > /tmp/cyclo-oauth-login 2>&1; then
            echo "cancelled OAuth login unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F "Select OpenAI Codex login method" /tmp/cyclo-oauth-login
          grep -F "Login cancelled" /tmp/cyclo-oauth-login
          docker run --rm --network none cyclo-gateway:ci providers
