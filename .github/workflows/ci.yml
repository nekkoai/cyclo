name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --editable ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q

  node-and-shell:
    name: Node and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run Node tests
        run: node --test tests/*.mjs
      - name: Check POSIX shell syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            sh -n "$script"
          done < <(git grep -l '^#!/bin/sh$')

  package:
    name: Package and clean-wheel audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install ".[dev]"
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Exercise a clean-copy wheel installation
        run: tools/release-acceptance
      - name: Confirm acceptance did not modify tracked files
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: cyclo-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Credential-free Docker build smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: |
          docker build --pull \
            --tag cyclo-runtime:ci \
            --file src/cyclo/vendor_gateway/runtime_context/Dockerfile \
            src/cyclo/vendor_gateway/runtime_context
      - name: Build gateway image
        run: |
          docker build --pull \
            --tag cyclo-gateway:ci \
            --file src/cyclo/vendor_gateway/gateway_context/Dockerfile \
            src/cyclo/vendor_gateway/gateway_context
      - name: Smoke-test images without credentials
        run: |
          docker run --rm --network none \
            --env CYCLO_HOST_UID=1000 \
            --env CYCLO_HOST_GID=1000 \
            cyclo-runtime:ci python3 --version
          docker run --rm --network none cyclo-gateway:ci providers.mjs
